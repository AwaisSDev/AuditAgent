[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditagent-mcp"
version = "0.3.2"
description = "MCP server for AuditAgent — ask about your agent logs, approvals, and compliance posture in plain English, from Claude, ChatGPT, Grok, or any other MCP client."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x renamed FastMCP -> MCPServer and changed the tool-registration
    # API; pin to the 1.x line this server's code (server.py) is written
    # against until it's migrated.
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27",
    # Used directly in server.py (ASGIApp/Receive/Scope/Send, the bearer-
    # token middleware) for the Streamable HTTP transport -- declared
    # explicitly rather than relying on it only ever being present
    # transitively via mcp.
    "starlette>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
auditagent-mcp = "auditagent_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["auditagent_mcp"]
