[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditagent-mcp"
version = "0.1.0"
description = "Claude MCP server for AuditAgent — ask about your agent logs, approvals, and compliance posture in plain English."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x renamed FastMCP -> MCPServer and changed the tool-registration
    # API; pin to the 1.x line this server's code (server.py) is written
    # against until it's migrated.
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
auditagent-mcp = "auditagent_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["auditagent_mcp"]
