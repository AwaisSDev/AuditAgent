[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI rejected "auditagent" as too similar to an already-registered,
# unrelated project ("audit-agent"). Renamed the package/module/CLI to
# "audagent" everywhere (not just the PyPI listing name) for one
# consistent name instead of a confusing split between what you `pip
# install` and what you `import`.
name = "AudAgent"
version = "0.2.3"
description = "Drop-in logging, human approvals, and compliance evidence for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AuditAgent" }]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "types-PyYAML"]

[project.urls]
Homepage = "https://auditagent.cloud"
Documentation = "https://auditagent.cloud/docs"

[project.scripts]
audagent = "audagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["audagent"]

[tool.mypy]
# The installed mypy version no longer emulates 3.9 itself; the package
# still declares requires-python >=3.9 (this code doesn't use anything
# 3.10-only, so checking against 3.10 semantics is a safe superset).
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
