[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditagent"
version = "0.1.0"
description = "Drop-in logging, human approvals, and compliance evidence for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AuditAgent" }]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://auditagent.dev"
Documentation = "https://auditagent.dev/docs"

[tool.hatch.build.targets.wheel]
packages = ["auditagent"]
