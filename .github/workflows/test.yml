name: Test

# Runs the parts of the test suite that don't need live Supabase/Anthropic/
# Slack/Whop credentials: the SDK's full suite, the backend's full suite
# (every router/service, 97%+ line coverage, all against an in-memory fake
# database), the MCP server's suite (its HTTP client against a mocked
# transport, tool registration/argument-forwarding), and the dashboard's
# typecheck + unit tests (Vitest, pure-logic modules) + production build.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
        working-directory: sdk
      - run: mypy tracyn
        working-directory: sdk
      - run: pytest -v
        working-directory: sdk

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      # These tests exercise pure logic only (no live Supabase/Redis/Anthropic
      # calls), but app/config.py's Settings still requires the two Supabase
      # fields to be set at import time — dummy values are enough.
      - run: pytest -v
        working-directory: backend
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder

  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
        working-directory: mcp-server
      - run: pytest -v
        working-directory: mcp-server
        env:
          TRACYN_API_KEY: test

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npx tsc --noEmit
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - name: Production build
        working-directory: dashboard
        env:
          # Build-time only placeholders — never real secrets. Public env vars
          # are baked into the client bundle at build time by Next.js, so the
          # build needs *some* value even though nothing here is live-tested.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_API_BASE_URL: https://placeholder.example.com
        run: npm run build
