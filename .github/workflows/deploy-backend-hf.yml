name: Deploy backend to Hugging Face Space

# Pushes the backend/ folder to a Docker Space on every change. Needs two
# repository settings (Settings -> Secrets and variables -> Actions):
#   secret  HF_TOKEN  a Hugging Face access token with "write" permission
#   variable HF_SPACE the Space id, e.g. awaissdev/auditagent-api

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push backend/ as the Space's main branch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          SHA=$(git subtree split --prefix backend HEAD)
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" "${SHA}:refs/heads/main"
